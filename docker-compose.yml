version: '3'

services:
  postgres:
    image: postgres:16.2
    container_name: store-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: store
    volumes:
      - postgres:/var/lib/postgresql/data
    command: postgres -c wal_level=logical

  redis:
    image: redis:7
    container_name: store-redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  postgres:
  redis_data: